<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Temitayo</title>
<meta name="theme-color" content="#160f12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A4%8D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#160f12;--plum:#2a1620;--wine:#5a2230;--rose:#d9a3a0;--champ:#e6cfa0;--ivory:#f6ece0;--paper:#f3e8d8;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif;--script:'Pinyon Script','Cormorant Garamond',cursive}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--ivory);font-family:var(--sans);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
.glow{position:fixed;inset:0;pointer-events:none;background:
 radial-gradient(60vmax 50vmax at 15% 10%,rgba(122,45,62,.45),transparent 60%),
 radial-gradient(50vmax 45vmax at 90% 95%,rgba(230,207,160,.14),transparent 60%),
 radial-gradient(40vmax 40vmax at 50% 50%,rgba(90,34,48,.25),transparent 70%)}
.dust{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dust i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:var(--champ);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.5}100%{transform:translateY(-105vh) translateX(24px);opacity:0}}
.screen{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;display:flex;padding:max(24px,env(safe-area-inset-top)) 22px max(28px,env(safe-area-inset-bottom));
 opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;visibility:visible}
.inner{margin:auto;width:100%;max-width:560px;text-align:center}
.rv{opacity:0;transform:translateY(10px);transition:opacity 1s ease,transform 1s ease}
.rv.show{opacity:1;transform:none}
h1,h2{font-family:var(--serif);font-weight:400;line-height:1.15}
.script{font-family:var(--script);color:var(--champ)}
.btn{font:500 15px/1 var(--sans);letter-spacing:.04em;color:var(--ink);background:linear-gradient(135deg,#f0dcb0,#d9b87c);border:0;border-radius:999px;padding:17px 30px;min-height:52px;cursor:pointer;
 box-shadow:0 10px 30px -10px rgba(230,207,160,.5);transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px rgba(230,207,160,.6)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ivory);border:1px solid rgba(246,236,224,.35);box-shadow:none}
.btn.ghost:hover{border-color:var(--champ);color:var(--champ)}
.btn.quiet{background:none;box-shadow:none;color:rgba(246,236,224,.6);font-weight:300;text-decoration:underline;text-underline-offset:5px;min-height:44px;padding:12px}
.btn:focus-visible,.card:focus-visible,.lb button:focus-visible{outline:2px solid var(--champ);outline-offset:3px}

/* 1 envelope */
#s1 h1{font-size:clamp(40px,11vw,64px);margin:6px 0 10px}
#s1 .sub{font-family:var(--serif);font-style:italic;font-size:clamp(19px,5vw,23px);color:rgba(246,236,224,.8);max-width:22em;margin:0 auto 38px;line-height:1.45}
.env{position:relative;width:min(82vw,330px);aspect-ratio:1.5;margin:0 auto 42px;perspective:900px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55))}
.env .back{position:absolute;inset:0;background:#e9d9c0;border-radius:6px}
.env .note{position:absolute;left:8%;right:8%;top:6%;bottom:6%;background:var(--paper);border-radius:3px;transition:transform 1.1s cubic-bezier(.6,0,.2,1) .7s;display:grid;place-items:center;font:34px var(--script);color:var(--wine)}
.env .front{position:absolute;inset:0;border-radius:6px;background:
 linear-gradient(to top right,transparent 49.6%,#d8c4a4 50%) left/50.5% 100% no-repeat,
 linear-gradient(to top left,transparent 49.6%,#d8c4a4 50%) right/50.5% 100% no-repeat,
 linear-gradient(#e4d2b4,#e4d2b4) bottom/100% 52% no-repeat;z-index:3;clip-path:inset(0 round 6px)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;background:#dcc9a8;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;z-index:4;transition:transform .9s cubic-bezier(.6,0,.2,1),z-index 0s .45s}
.env .seal{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;z-index:5;background:radial-gradient(circle at 35% 30%,#a8404f,#5a2230 70%);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:opacity .4s,transform .4s}
.env .seal svg{width:24px;fill:#f2c9c4}
.env.open .seal{opacity:0;transform:scale(.6)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .note{transform:translateY(-62%)}

/* 2 letter */
#s2 .paper{position:relative;background:var(--paper);color:#3a2428;text-align:left;border-radius:4px;padding:clamp(28px,7vw,52px) clamp(24px,6.5vw,48px);
 box-shadow:0 40px 70px -30px #000,inset 0 0 60px rgba(150,110,70,.12);transform:rotate(-.5deg)}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(90,34,48,.18);border-radius:2px;pointer-events:none}
.paper p{font-family:var(--serif);font-size:clamp(19px,4.9vw,22px);line-height:1.6;margin-bottom:1em}
.paper .to{font-family:var(--script);font-size:clamp(34px,9vw,44px);color:var(--wine);margin-bottom:.3em}
.paper .sign{font-family:var(--script);font-size:38px;color:var(--wine);text-align:right;margin:.2em 0 0}
#s2 .btn{margin-top:30px}

/* 3 gallery */
#s3 .inner{max-width:980px}
#s3 h2{font-size:clamp(34px,8.5vw,52px);margin-bottom:8px}
#s3 .lead{font-family:var(--serif);font-style:italic;font-size:20px;color:rgba(246,236,224,.7);margin-bottom:34px}
.grid{columns:1;column-gap:22px;text-align:left}
@media(min-width:620px){.grid{columns:2}}@media(min-width:960px){.grid{columns:3}}
.card{break-inside:avoid;margin:0 0 26px;background:var(--ivory);padding:10px 10px 14px;border-radius:14px;cursor:pointer;display:block;width:100%;border:0;text-align:left;color:#3a2428;
 box-shadow:0 18px 40px -18px #000;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .5s;position:relative}
.card:nth-child(odd){transform:rotate(-1.1deg)}.card:nth-child(even){transform:rotate(1deg)}
.card:hover{transform:rotate(0) translateY(-6px) scale(1.01);box-shadow:0 30px 50px -18px #000}
.card::before{content:"";position:absolute;top:-9px;left:50%;width:64px;height:20px;margin-left:-32px;background:rgba(230,207,160,.55);transform:rotate(-3deg);border-radius:2px;z-index:2}
.card .ph{border-radius:8px;overflow:hidden;background:#e2d3c0;aspect-ratio:3/4}
.card.land .ph{aspect-ratio:4/3}.card.tall .ph{aspect-ratio:9/16}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}
.card:hover img{transform:scale(1.05)}
.card .cap{font-family:var(--serif);font-style:italic;font-size:18px;padding:12px 6px 0;line-height:1.35}
.card.empty{cursor:default;background:rgba(246,236,224,.06);border:1px dashed rgba(230,207,160,.5);color:var(--champ);box-shadow:none}
.card.empty .ph{background:none;display:grid;place-items:center;text-align:center;padding:16px;font-size:14px;line-height:1.5;font-weight:300;color:rgba(246,236,224,.75)}
.card.empty:hover{transform:none}.card.empty img{display:none}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,6,8,.94);display:none;align-items:center;justify-content:center;padding:56px 14px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain;animation:fade .4s}
.lb button{position:absolute;background:rgba(246,236,224,.12);color:var(--ivory);border:0;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer}
.lb .x{top:max(12px,env(safe-area-inset-top));right:14px}.lb .p{left:10px;top:50%}.lb .n{right:10px;top:50%}
@keyframes fade{from{opacity:0;transform:scale(.98)}}

/* 4 ask */
#s4 h2{font-size:clamp(26px,7vw,36px);font-style:italic;color:rgba(246,236,224,.8);margin-bottom:26px}
#s4 .big{font-size:clamp(34px,9.5vw,56px);margin-bottom:26px}
#s4 .body{font-family:var(--serif);font-size:clamp(20px,5vw,24px);line-height:1.6;color:rgba(246,236,224,.9);margin-bottom:1em}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:32px;align-items:stretch}
.choices .btn{width:100%}
.reply{display:none}.reply.on{display:block;animation:fade .9s}
.reply h3{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,42px);line-height:1.2;margin-bottom:20px}
.reply p{font-family:var(--serif);font-size:clamp(20px,5vw,24px);line-height:1.55;margin-bottom:.9em;color:rgba(246,236,224,.9)}
.reply .btn{margin-top:16px}
.fx{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.fx i{position:absolute;top:-20px;width:9px;height:13px;border-radius:60% 0 60% 0;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

/* 5 end */
#s5 .flower{width:150px;height:190px;margin:0 auto 18px;overflow:visible}
.stem{stroke:#8fa886;stroke-width:2;fill:none;stroke-dasharray:140;stroke-dashoffset:140}
.on-end .stem{animation:draw 2.2s ease forwards .3s}
@keyframes draw{to{stroke-dashoffset:0}}
.petal{fill:#e7b5b0;opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scale(.2)}
.on-end .petal{animation:bloom 1.4s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:calc(2s + var(--i)*.14s)}
@keyframes bloom{to{opacity:.92;transform:scale(1)}}
.core{fill:var(--champ);opacity:0}.on-end .core{animation:bloom 1s forwards 3s}
.sway{transform-origin:75px 185px}.on-end .sway{animation:sway 6s ease-in-out infinite 4s}
@keyframes sway{50%{transform:rotate(2.5deg)}}
#s5 p{font-family:var(--serif);font-size:clamp(22px,5.6vw,27px);line-height:1.55;margin-bottom:.9em}
#s5 .with{font-family:var(--serif);font-style:italic;font-size:22px;color:rgba(246,236,224,.7);margin-top:30px}
#s5 .name{font-size:58px;line-height:1.1}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}.dust{display:none}}
</style>
</head>
<body>
<div class="glow"></div><div class="dust" id="dust" aria-hidden="true"></div>

<!-- 1 -->
<section class="screen active" id="s1"><div class="inner">
 <h1 class="script rv" id="c-hello"></h1>
 <p class="sub rv" id="c-sub"></p>
 <div class="env rv" id="env" aria-hidden="true"><div class="back"></div><div class="note">♡</div><div class="front"></div><div class="flap"></div>
  <div class="seal"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 2.9 5 6.4 5c2 0 3.7 1.1 5.6 3.2C13.900 6.100 15.600 5 17.600 5c3.500 0 5.400 3.600 4 6.800C19.500 16.400 12 21 12 21z"/></svg></div></div>
 <button class="btn rv" id="openBtn"></button>
</div></section>

<!-- 2 -->
<section class="screen" id="s2"><div class="inner">
 <div class="paper rv"><div class="to" id="l-to"></div><div id="l-body"></div><div class="sign" id="l-sign"></div></div>
 <button class="btn rv" data-go="3" id="l-next"></button>
</div></section>

<!-- 3 -->
<section class="screen" id="s3"><div class="inner">
 <h2 class="script rv" id="g-title"></h2><p class="lead rv" id="g-lead"></p>
 <div class="grid rv" id="grid"></div>
 <button class="btn rv" data-go="4" id="g-next"></button>
</div></section>

<!-- 4 -->
<section class="screen" id="s4"><div class="inner">
 <div id="ask">
  <h2 class="rv" id="a-pre"></h2>
  <h1 class="script big rv" id="a-big"></h1>
  <div id="a-body"></div>
  <div class="choices rv"><button class="btn" id="b-yes"></button><button class="btn ghost" id="b-more"></button><button class="btn quiet" id="b-no"></button></div>
 </div>
 <div class="reply" id="reply"></div>
</div></section>

<!-- 5 -->
<section class="screen" id="s5"><div class="inner">
 <svg class="flower rv" viewBox="0 0 150 190" aria-hidden="true"><g class="sway">
  <path class="stem" d="M75 185 C70 150 82 120 75 80"/>
  <path class="stem" d="M76 150 C95 140 105 130 108 118" style="stroke-dasharray:60;stroke-dashoffset:60"/>
  <g id="petals"></g><circle class="core" cx="75" cy="62" r="9"/></g></svg>
 <p class="rv" id="e-1"></p><p class="rv" id="e-2"></p>
 <div class="with rv" id="e-with"></div><div class="script name rv" id="e-name"></div>
</div></section>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
 <button class="x" aria-label="Close">✕</button><button class="p" aria-label="Previous">‹</button><img alt=""><button class="n" aria-label="Next">›</button>
</div>

<script>
/* ============ EDIT EVERYTHING HERE ============ */
const CONTENT={
 hello:"Hey, Temitayo. ❤️",
 sub:"I made a little something for you. Nothing complicated. Just something from my heart.",
 openBtn:"Open your little surprise ❤️",
 letter:{
  to:"Temitayo,",
  paragraphs:[
   "I don't think I say this enough, but there's something about you that makes me genuinely happy. Sometimes it's the simplest things that make someone special, and I find myself appreciating those little things about you.",
   "I'm not great at big speeches, so I did the one thing I know how to do and built you a website. Yes, I'm that guy.",
   "I just wanted you to know that you're appreciated, and that I think about you more than I let on. No reason, no occasion. You're simply someone I'd like to know even better.",
   "So I hope this makes you smile. If it does, mission accomplished."],
  sign:"Garry",next:"Keep going"},
 gallery:{title:"A little reminder",lead:"That you're special.",next:"There's one more thing…"},
 /* PHOTOS: add or remove entries. shape: "portrait" | "landscape" | "tall". Files live in /images */
 photos:[
  {src:"images/photo1.jpg",shape:"portrait",caption:"Just a little reminder that you're special."},
  {src:"images/photo2.jpg",shape:"tall",caption:"Some things don't need words."},
  {src:"images/photo3.jpg",shape:"landscape",caption:"You make things better."},
  {src:"images/photo4.jpg",shape:"portrait",caption:"Smile like this more often."},
  {src:"images/photo5.jpg",shape:"portrait",caption:"This one's for you."},
  {src:"images/photo6.jpg",shape:"landscape",caption:"Still thinking of you."}],
 ask:{
  pre:"Now, there's something I've been wanting to ask you…",
  big:"Temitayo, I'd really love to host you at my place this weekend. ❤️",
  body:["Nothing complicated. Just you and me, good conversations, laughter, maybe something nice to eat, and some quality time together.",
   "I'd love to have you around, make you smile and enjoy your company.","Would you do me the honour?"],
  yes:"I'd love to, Garry! 🥹❤️",more:"Tell me more about the plans 😂",no:"Maybe another time ❤️"},
 replies:{
  yes:{h:"Okay, now you've made me smile! ❤️",p:["I genuinely can't wait to spend some time with you.","Let's figure out what works best for you. 🥰"]},
  more:{h:"Hahaha, I knew you'd want the details! 😂❤️",p:["All I know is that having you around would make my weekend a whole lot better.","We can figure out the little details together."],alt:"Okay, I'm in 🥹❤️"},
  no:{h:"That's absolutely okay.",p:["No pressure at all. I just wanted you to know that I'd love to spend some time with you."]},
  next:"One last thing"},
 end:{l1:"Regardless of everything, I hope this made you smile.",l2:"You deserve beautiful moments, genuine happiness and people who appreciate you.",with:"With love,",name:"Garry ❤️"}
};
/* ============================================== */
const $=id=>document.getElementById(id),C=CONTENT;
const br=s=>s.replace(/\n/g,'<br>');
$('c-hello').textContent=C.hello;$('c-sub').textContent=C.sub;$('openBtn').textContent=C.openBtn;
$('l-to').textContent=C.letter.to;$('l-body').innerHTML=C.letter.paragraphs.map(t=>`<p>${t}</p>`).join('');
$('l-sign').textContent='— '+C.letter.sign;$('l-next').textContent=C.letter.next;
$('g-title').textContent=C.gallery.title;$('g-lead').textContent=C.gallery.lead;$('g-next').textContent=C.gallery.next;
$('a-pre').textContent=C.ask.pre;$('a-big').textContent=C.ask.big;
$('a-body').innerHTML=C.ask.body.map(t=>`<p class="body rv">${t}</p>`).join('');
$('b-yes').textContent=C.ask.yes;$('b-more').textContent=C.ask.more;$('b-no').textContent=C.ask.no;
$('e-1').textContent=C.end.l1;$('e-2').textContent=C.end.l2;$('e-with').textContent=C.end.with;$('e-name').textContent=C.end.name;
document.title='For '+C.letter.to.replace(',','');

/* petals */
$('petals').innerHTML=[...Array(8)].map((_,i)=>`<ellipse class="petal" style="--i:${i}" cx="75" cy="40" rx="9" ry="20" transform="rotate(${i*45} 75 62)"/>`).join('');
/* dust */
$('dust').innerHTML=[...Array(16)].map(()=>`<i style="left:${Math.random()*100}%;animation-duration:${14+Math.random()*14}s;animation-delay:${-Math.random()*20}s;transform:scale(${.6+Math.random()})"></i>`).join('');

/* gallery */
const grid=$('grid'),shown=[];
C.photos.forEach((p,i)=>{
 const el=document.createElement('button');
 el.className='card '+(p.shape==='landscape'?'land':p.shape==='tall'?'tall':'');
 el.innerHTML=`<div class="ph"><img src="${p.src}" alt="Photo of Temitayo" loading="lazy"></div><div class="cap"></div>`;
 el.querySelector('.cap').textContent=p.caption;
 const img=el.querySelector('img');
 img.onerror=()=>{el.classList.add('empty');el.querySelector('.ph').insertAdjacentHTML('beforeend',`Photo ${i+1}<br>Save your picture as<br><b>${p.src}</b>`);el.querySelector('.cap').textContent='';el.onclick=null};
 img.onload=()=>{shown.push(p.src)};
 el.onclick=()=>openLb(p.src);grid.appendChild(el)});
const lb=$('lb'),lbi=lb.querySelector('img');let li=0;
const avail=()=>[...grid.querySelectorAll('.card:not(.empty) img')].map(x=>x.getAttribute('src'));
function openLb(src){const a=avail();li=a.indexOf(src);lbi.src=src;lb.classList.add('on');lb.querySelector('.x').focus()}
function step(d){const a=avail();if(!a.length)return;li=(li+d+a.length)%a.length;lbi.src=a[li];lbi.style.animation='none';lbi.offsetWidth;lbi.style.animation=''}
lb.querySelector('.x').onclick=()=>lb.classList.remove('on');lb.querySelector('.p').onclick=()=>step(-1);lb.querySelector('.n').onclick=()=>step(1);
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});

/* screens */
let cur=1;
function go(n){
 const from=$('s'+cur),to=$('s'+n);from.classList.remove('active');to.classList.add('active');to.scrollTop=0;cur=n;
 const rv=to.querySelectorAll('.rv');rv.forEach(r=>r.classList.remove('show'));
 setTimeout(()=>rv.forEach((r,i)=>{r.style.transitionDelay=(Math.min(i,8)*.28+.25)+'s';r.classList.add('show')}),60);
 if(n===5)to.classList.add('on-end');
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));
requestAnimationFrame(()=>{const rv=$('s1').querySelectorAll('.rv');rv.forEach((r,i)=>{r.style.transitionDelay=(i*.35+.3)+'s';r.classList.add('show')})});

$('openBtn').onclick=function(){this.disabled=true;$('env').classList.add('open');setTimeout(()=>go(2),2100)};

/* answer */
function burst(){const fx=document.createElement('div');fx.className='fx';const cols=['#e7b5b0','#e6cfa0','#f6ece0','#a8404f'];
 for(let i=0;i<46;i++){const p=document.createElement('i');p.style.cssText=`left:${Math.random()*100}%;background:${cols[i%4]};--dx:${(Math.random()-.5)*160}px;--r:${Math.random()*720}deg;animation-duration:${3+Math.random()*3}s;animation-delay:${Math.random()*.9}s`;fx.appendChild(p)}
 document.body.appendChild(fx);setTimeout(()=>fx.remove(),7500)}
function answer(k){
 const r=C.replies[k];$('ask').style.display='none';const box=$('reply');
 box.innerHTML=`<h3 class="script">${r.h}</h3>${r.p.map(t=>`<p>${t}</p>`).join('')}`+
  (r.alt?`<button class="btn" id="alt">${r.alt}</button><br>`:'')+`<button class="btn ${r.alt?'quiet':''}" id="after">${C.replies.next}</button>`;
 box.classList.add('on');$('s4').scrollTop=0;
 if(k==='yes')burst();
 if(r.alt)$('alt').onclick=()=>{answer('yes')};
 $('after').onclick=()=>{box.classList.remove('on');go(5)};
}
$('b-yes').onclick=()=>answer('yes');$('b-more').onclick=()=>answer('more');$('b-no').onclick=()=>answer('no');
</script>
</body>
</html>
